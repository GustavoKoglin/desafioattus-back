name: Backend CI/CD

on:
  push:
    branches:
      - main
      - pr-scripts-env
  pull_request:
    branches:
      - main
      - pr-scripts-env
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker compose -f docker-compose.yml build
          docker tag desafioattus_back ${{ secrets.DOCKERHUB_USERNAME }}/desafioattus_back:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/desafioattus_back:latest
