# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Backend CI/CD

on:
  push:
    branches:
      - main
      - pr-scripts-env
  pull_request:
    branches:
      - main
      - pr-scripts-env
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker compose -f docker-compose.yml build

      - name: Start Docker container
        run: |
          # start and wait for services to become healthy (compose v2 supports --wait)
          docker compose -f docker-compose.yml up -d --wait || true

      - name: Show containers
        run: docker compose -f docker-compose.yml ps

      - name: Smoke test health endpoint
        run: |
          set -e
          echo "Waiting for /health to respond..."
          for i in {1..12}; do
            if curl -sSf http://localhost:3000/health > /dev/null; then
              echo "health ok"
              break
            fi
            echo "attempt $i: waiting 2s..."
            sleep 2
          done
          echo "Running final curl check"
          if ! curl --fail --retry 3 --retry-delay 2 http://localhost:3000/health; then
            echo "Health check failed, dumping container logs for debugging"
            docker compose -f docker-compose.yml logs --no-color --tail=200
            exit 1
          fi

      - name: Stop Docker container
        if: always()
        run: docker compose -f docker-compose.yml down

  vercel-check:
    name: Vercel public health check
    runs-on: ubuntu-latest
    needs: test-and-build
    env:
      VERCEL_HEALTH_URL: ${{ secrets.VERCEL_HEALTH_URL }}
    if: ${{ env.VERCEL_HEALTH_URL != '' }}
    steps:
      - name: Public health check
        run: |
          set -e
          echo "Checking Vercel health at $VERCEL_HEALTH_URL"
          for i in {1..12}; do
            if curl -sSf "$VERCEL_HEALTH_URL" > /dev/null; then
              echo "vercel health ok"
              break
            fi
            echo "attempt $i: waiting 5s..."
            sleep 5
          done
          if ! curl --fail --retry 3 --retry-delay 2 "$VERCEL_HEALTH_URL"; then
            echo "Vercel health check failed"
            exit 1
          fi
